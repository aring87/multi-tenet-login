id: 4529330b-6785-4c96-a6fe-f105edad95ac
name: TEST - Pipeline validation - heartbeat observed
description: >
  Non-security test rule used to validate the detection-as-code pipeline
  end to end. Confirms bundle build, query check, what-if, and deployment
  against a target workspace. Deploys disabled and is not intended for
  activation or alerting.
owner: security-engineering
status: baseline
enabled: false
severity: Informational
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: []
techniques: []
query: |
  Heartbeat
  | where TimeGenerated > ago(1h)
  | summarize LastHeartbeat = arg_max(TimeGenerated, *) by Computer
  | project
      TimeGenerated = LastHeartbeat,
      Computer,
      OSType,
      OSName,
      ResourceGroup = ResourceGroup,
      TestReason = "pipeline validation"
  | take 5
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
customDetails:
  TestReason: TestReason
  HostOSType: OSType
createIncident: false
