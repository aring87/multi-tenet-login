id: 93dbeac4-3612-4c55-ab56-5cdaaf57b806
name: MFA fatigue - repeated push denials for a single account
description: |
  Detects accounts that deny a high number of MFA prompts within a short window,
  which is the signature of an attacker who already holds valid credentials and is
  spamming push notifications hoping the user eventually approves one.
  Requires the Azure Active Directory / Entra ID connector with SigninLogs enabled.
  Expected repeated results: service accounts or users with misconfigured devices
  will trip this legitimately and should be tuned out by UserPrincipalName.
owner: security-engineering
status: baseline
enabled: false
severity: High
kind: Scheduled

queryFrequency: PT6H
queryPeriod: P7D
triggerOperator: GreaterThan
triggerThreshold: 0

tactics:
  - CredentialAccess
techniques:
  - T1621

query: |
  let denialThreshold = 5;
  let windowSize = 1h;
  SigninLogs
  | where ResultType == "500121"
  | extend FailureDetail = tostring(Status.additionalDetails)
  | where FailureDetail has_any ("user declined the authentication", "MFA denied")
  | summarize
      DenialCount = count(),
      FirstDenial = min(TimeGenerated),
      LastDenial = max(TimeGenerated),
      SourceIPs = make_set(IPAddress, 25),
      Applications = make_set(AppDisplayName, 25),
      Locations = make_set(strcat(tostring(LocationDetails.countryOrRegion), "/", tostring(LocationDetails.city)), 25)
      by UserPrincipalName, UserId, bin(TimeGenerated, windowSize)
  | where DenialCount > denialThreshold
  | extend
      DistinctIPCount = array_length(SourceIPs),
      DenialWindowMinutes = datetime_diff('minute', LastDenial, FirstDenial)
  | project
      TimeGenerated = FirstDenial,
      UserPrincipalName,
      UserId,
      DenialCount,
      DenialWindowMinutes,
      DistinctIPCount,
      SourceIPs,
      Applications,
      Locations
  | order by DenialCount desc

createIncident: true
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT6H
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
