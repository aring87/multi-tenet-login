id: d5cb9713-bf3f-481b-a505-cd8da17c9890
name: Attempts to sign in to disabled accounts
description: |-
  Identifies failed attempts to sign in to disabled accounts across multiple Azure Applications.
  Default threshold for Azure Applications attempted to sign in to is 3.
  References: https://docs.microsoft.com/azure/active-directory/reports-monitoring/reference-sign-ins-error-codes
  50057 - User account is disabled. The account has been disabled by an administrator.
owner: security-engineering
status: baseline
kind: Scheduled
severity: Informational
enabled: true
query: "let threshold = 3;\nlet aadFunc = (tableName:string) {\n    table(tableName)\n    | where ResultType == \"50057\"\n\
  \    | where ResultDescription =~ \"User account is disabled. The account has been disabled by an administrator.\"\n   \
  \ | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated), applicationCount = dcount(AppDisplayName),\n\
  \        applicationSet = make_set(AppDisplayName), count() by UserPrincipalName, IPAddress, Type\n    | where applicationCount\
  \ >= threshold\n    | where not(tolower(UserPrincipalName) matches regex \"_jit.*\")  // Case-insensitive match and exclude\n\
  \    | extend Name = tostring(split(UserPrincipalName,'@',0)[0]), \n             UPNSuffix = tostring(split(UserPrincipalName,'@',1)[0])\n\
  };\nlet aadSignin = aadFunc(\"SigninLogs\");\nlet aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\");\nunion isfuzzy=true\
  \ aadSignin, aadNonInt"
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- InitialAccess
techniques: []
subTechniques: []
alertRuleTemplateName: 75ea5c39-93e5-489b-b1e1-68fa6c9d2d04
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
