id: f98e2ac4-8d3a-4e79-bcda-bf43afec1775
name: Authentication Methods Changed for Privileged Account
description: |-
  Identifies authentication methods being changed for a privileged account. This could be an indication of an attacker adding an auth method to the account so they can have continued access.
  Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-privileged-accounts#things-to-monitor-1
owner: security-engineering
status: baseline
kind: Scheduled
severity: High
enabled: true
query: "let security_info_actions = dynamic([\"User registered security info\", \"User changed default security info\", \"\
  User deleted security info\", \"Admin updated security info\", \"Admin deleted security info\", \"Admin registered security\
  \ info\"]);\nlet VIPUsers = (\n    IdentityInfo\n    | where AccountCreationTime < ago(24h)\n    | mv-expand AssignedRoles\n\
  \    | where AssignedRoles contains 'Admin'\n    | summarize by AccountUPN);\nAuditLogs\n| where Category =~ \"UserManagement\"\
  \n| where ActivityDisplayName in (security_info_actions)\n| extend InitiatingAppName = tostring(InitiatedBy.app.displayName)\n\
  | extend InitiatingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)\n| extend InitiatingUserPrincipalName\
  \ = tostring(InitiatedBy.user.userPrincipalName)\n| extend InitiatingAadUserId = tostring(InitiatedBy.user.id)\n| extend\
  \ InitiatingIpAddress = tostring(iff(isnotempty(InitiatedBy.user.ipAddress), InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))\n\
  | mv-apply TargetResource = TargetResources on \n    (\n    where TargetResource.type =~ \"User\"\n    | extend TargetUserPrincipalName\
  \ = tostring(TargetResource.userPrincipalName)\n    )\n| where TargetUserPrincipalName !contains \"_jit\"\n| where TargetUserPrincipalName\
  \ in~ (VIPUsers)\n// Uncomment the line below if you are experiencing high volumes of Target entities. If this is uncommented,\
  \ the Target column will not be mapped to an entity.\n//| summarize Start=min(TimeGenerated), End=max(TimeGenerated), Actions\
  \ = make_set(ResultReason, MaxSize=8), Targets=make_set(Target, MaxSize=256) by Initiator, IP, Result\n// Comment out this\
  \ line below, if line above is used.\n| summarize\n    Start=min(TimeGenerated),\n    End=max(TimeGenerated),\n    Actions\
  \ = make_set(ResultReason, MaxSize=8)\n    by\n    InitiatingAppName,\n    InitiatingAppServicePrincipalId, \n    InitiatingUserPrincipalName,\n\
  \    InitiatingAadUserId,\n    InitiatingIpAddress,\n    TargetUserPrincipalName,\n    Result\n| extend\n    InitiatingAccountName\
  \ = tostring(split(InitiatingUserPrincipalName, \"@\")[0]),\n    InitiatingAccountUPNSuffix = tostring(split(InitiatingUserPrincipalName,\
  \ \"@\")[1]), \n    TargetName = iff(tostring(TargetUserPrincipalName) has \"[\", \"\", tostring(split(TargetUserPrincipalName,\
  \ '@', 0)[0])),\n    TargetUPNSuffix = iff(tostring(TargetUserPrincipalName) has \"[\", \"\", tostring(split(TargetUserPrincipalName,\
  \ '@', 1)[0]))"
queryFrequency: PT2H
queryPeriod: P2D
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- Persistence
techniques: []
subTechniques: []
alertRuleTemplateName: 694c91ee-d606-4ba9-928e-405a2dd0ff0f
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
