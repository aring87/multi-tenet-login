id: a20c7ad9-60f4-4569-b844-2c3245b960ec
name: Conditional Access - A Conditional Access policy was deleted
description: A Conditional Access policy was deleted from Entra ID.
owner: security-engineering
status: baseline
kind: Scheduled
severity: Low
enabled: true
query: |-
  // A Conditional Access policy was deleted.
  AuditLogs
  | where OperationName in ("Delete conditional access policy")
  | where Result == "success"
  | extend modifiedBy = InitiatedBy.user.userPrincipalName
  | extend CAPolicy = TargetResources[0].displayName
  | extend NewCAPolicySettings = TargetResources[0].modifiedProperties[0].newValue
  | extend OldCAPolicySettings = TargetResources[0].modifiedProperties[0].oldValue
  | project
      TimeGenerated,
      OperationName,
      CAPolicy,
      modifiedBy,
      Result,
      OldCAPolicySettings = TargetResources[0].modifiedProperties[0].oldValue
  | order by TimeGenerated desc
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- DefenseEvasion
techniques: []
subTechniques: []
alertRuleTemplateName: 2e96fa64-ac4d-4c92-b79e-e9c54b5d8230
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
