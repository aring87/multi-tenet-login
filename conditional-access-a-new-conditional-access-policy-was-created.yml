id: 5f34735f-c0c2-40f3-975b-ea2e851dff22
name: Conditional Access - A new Conditional Access policy was created
description: A new Conditional Access policy was created in Entra ID.
owner: security-engineering
status: baseline
kind: Scheduled
severity: Low
enabled: true
query: |-
  // A new Conditional Access policy was created.
  AuditLogs
  | where OperationName in ("Add conditional access policy")
  | where Result == "success"
  | extend modifiedBy = InitiatedBy.user.userPrincipalName
  | extend CAPolicy = TargetResources[0].displayName
  | extend NewCAPolicySettings = TargetResources[0].modifiedProperties[0].newValue
  | project
      TimeGenerated,
      OperationName,
      CAPolicy,
      CreatedBy = modifiedBy,
      Result,
      NewCAPolicySettings
  | order by TimeGenerated desc
queryFrequency: PT15M
queryPeriod: PT15M
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- DefenseEvasion
techniques: []
subTechniques: []
alertRuleTemplateName: 0459a1b5-909d-4783-9e27-24536b05a47f
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
