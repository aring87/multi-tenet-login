id: 0f520203-478e-4498-b45c-34be04143e7c
name: Halo/Sentinel Integration Secret Key About to Expire
description: Rotate the Halo/Sentinel Integration app secret key in Entra before the expiry date, then update the integration,
  LastPass, and ExpiryDate in this analytics rule.
owner: security-engineering
status: baseline
kind: Scheduled
severity: High
enabled: true
query: "let ExpiryDate = datetime(2027-09-03T00:00:00Z);\r\nlet AppName = \"Halo/Sentinel Integration\";\r\nlet AppId = \"\
  5d55303a-089f-426a-8392-2d4f01474ef8\";\r\nlet ObjectId = \"70db26e4-35c9-46a9-af54-5ec43b3ab6d2\";\r\nHeartbeat\r\n| take\
  \ 1\r\n| project\r\n    AppDisplayName = AppName,\r\n    AppId = AppId,\r\n    ObjectId = ObjectId,\r\n    Expiry = ExpiryDate,\r\
  \n    DaysUntilExpiry = datetime_diff('day', ExpiryDate, now())\r\n| where DaysUntilExpiry <= 15\r\n"
queryFrequency: P1D
queryPeriod: P1D
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT5H
suppressionEnabled: false
tactics: []
techniques: []
subTechniques: []
eventGroupingSettings:
  aggregationKind: AlertPerResult
sentinelEntitiesMappings:
- columnName: AppDisplayName
- columnName: AppId
- columnName: ObjectId
createIncident: true
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5H
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
