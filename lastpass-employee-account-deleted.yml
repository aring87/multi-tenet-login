id: fb418fed-a0f7-44ba-8865-ac5065304f4c
name: LastPass - Employee account deleted
description: |-
  This rule will monitor for any employee accounts being deleted.
  Deleting an employee account can have a big potential impact as all of the data for that user will be removed.
owner: security-engineering
status: baseline
kind: Scheduled
severity: Medium
enabled: true
query: |-
  prod_LastPass_AuditLogs_CL
  | where Action_s == "Employee Account Deleted" or Action_s == "Remove User From Company"
  | extend AccountCustomEntity = Username_s, IPCustomEntity = Ip_s
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- Impact
techniques: []
subTechniques: []
alertRuleTemplateName: 8a2cc466-342d-4ebb-8871-f9e1d83a24a5
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
