id: ef5e2d52-97a9-4bcb-a781-94409a59a008
name: LastPass - Failed sign-ins into LastPass due to MFA
description: "This rule will check if a sign-in failed into LastPass due to MFA.\nAn incident can indicate the potential brute\
  \ forcing of a LastPass account. \nThe use of MFA is identified by combining the sign-in logs, this rule assumes LastPass\
  \ is federated to AAD."
owner: security-engineering
status: baseline
kind: Scheduled
severity: Low
enabled: true
query: |-
  prod_LastPass_AuditLogs_CL
  | where Action_s == "Log in"
  | join (SigninLogs | where AppDisplayName == "LastPass Enterprise") on $left.Ip_s == $right.IPAddress and $left.Username_s == $right.UserPrincipalName
  | where ResultType in (50074, 50076)
  | extend AccountCustomEntity = Username_s, IPCustomEntity = Ip_s
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- InitialAccess
techniques: []
subTechniques: []
alertRuleTemplateName: 760b8467-e6cc-4006-9149-5696845c1a54
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
