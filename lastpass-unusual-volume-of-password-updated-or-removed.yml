id: 5f7827a4-5003-4b2c-bb90-15d75eca6d93
name: LastPass - Unusual Volume of Password Updated or Removed
description: |-
  This rule will check if there is an unnormal activity of sites that are deleted or changed per user.
   The normal amount of actions is calculated based on the previous 14 days of activity. If there is a significant increase, an incident will be created.
owner: security-engineering
status: baseline
kind: Scheduled
severity: Low
enabled: true
query: "let threshold = toscalar (prod_LastPass_AuditLogs_CL\n    | where todatetime(LogTime_t) >= startofday(ago(14d)) and\
  \ todatetime(LogTime_t) < startofday(ago(1d))\n    | where Action_s == \"Site Changed\" or Action_s == \"Deleted Sites\"\
  \ \n    | summarize count() by Username_s, bin(todatetime(LogTime_t), 1d)\n    | summarize avg(count_), stdev(count_)\n\
  \    | project threshold = avg_count_ + stdev_count_ * 2);\nprod_LastPass_AuditLogs_CL\n| where Username_s != \"API\"\n\
  | where (Action_s == \"Site Changed\" or Action_s == \"Deleted Sites\") and todatetime(LogTime_t) >= ago(1d)\n| summarize\
  \ count() by Username_s, Ip_s\n| where count_ > ['threshold']\n| extend AccountCustomEntity = Username_s, IPCustomEntity\
  \ = Ip_s, threshold"
queryFrequency: P1D
queryPeriod: P14D
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- Impact
techniques: []
subTechniques: []
alertRuleTemplateName: a3bbdf60-0a6d-4cc2-b1d1-dd70aca184ce
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
