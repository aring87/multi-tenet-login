id: 05713b83-dad5-47cd-8558-8da670ec4f40
name: MFA disabled for a user
description: Multi-Factor Authentication (MFA) helps prevent credential compromise. This alert identifies when an attempt
  has been made to disable MFA for a user. (Does not cover CAP exclusions at this time)
owner: security-engineering
status: baseline
kind: Scheduled
severity: Medium
enabled: true
query: "AuditLogs \n| where OperationName =~ \"Disable Strong Authentication\"\n| extend IPAddress = tostring(parse_json(tostring(InitiatedBy.user)).ipAddress)\
  \ \n| extend InitiatedByUser = iff(\n                               isnotempty(tostring(parse_json(tostring(InitiatedBy.user)).userPrincipalName)),\
  \ \n                               tostring(parse_json(tostring(InitiatedBy.user)).userPrincipalName),\n               \
  \                tostring(parse_json(tostring(InitiatedBy.app)).displayName)\n                           )\n| extend Targetprop\
  \ = todynamic(TargetResources)\n| extend TargetUser = tostring(Targetprop[0].userPrincipalName) \n| summarize StartTimeUtc\
  \ = min(TimeGenerated), EndTimeUtc = max(TimeGenerated)\n    by\n    User = TargetUser,\n    InitiatedByUser,\n    Operation\
  \ = OperationName,\n    CorrelationId,\n    IPAddress,\n    Category,\n    Source = SourceSystem,\n    AADTenantId,\n  \
  \  Type\n| extend timestamp = StartTimeUtc, AccountCustomEntity = User, IPCustomEntity = IPAddress\n"
queryFrequency: PT1H
queryPeriod: PT2H
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT5H
suppressionEnabled: false
tactics:
- DefenseEvasion
techniques:
- T1078
- T1556
subTechniques:
- T1556.006
eventGroupingSettings:
  aggregationKind: SingleAlert
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: AccountCustomEntity
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPCustomEntity
createIncident: true
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5H
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
