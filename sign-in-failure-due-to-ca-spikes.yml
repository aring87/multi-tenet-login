id: 1d8fc216-8b73-4fbe-ba8f-2d3275c656bd
name: Sign in Failure due to CA Spikes
description: |-
  Identifies spike in failed sign-ins from user accounts due to conditional access policies. Spike is determined based on Time series anomaly which will look at historical baseline values.

  Ref : https://docs.microsoft.com/azure/active-directory/fundamentals/security-operations-user-accounts#monitoring-for-failed-unusual-sign-ins

  This query has been updated to include UEBA logs IdentityInfo and BehaviorAnalytics for contextual information around the results.'
owner: security-engineering
status: baseline
kind: Scheduled
severity: Informational
enabled: true
query: "let riskScoreCutoff = 20; //Adjust this based on volume of results\n  let starttime = 14d;\n  let timeframe = 1d;\n\
  \  let scorethreshold = 3;\n  let baselinethreshold = 50;\n  let aadFunc = (tableName:string){\n    // Failed Signins attempts\
  \ with reasoning related to conditional access policies.\n    table(tableName)\n    | where TimeGenerated between (startofday(ago(starttime))..startofday(now()))\n\
  \    | where ResultDescription has_any (\"conditional access\", \"CA\") or ResultType in (50005, 50131, 53000, 53001, 53002,\
  \ 52003, 70044)\n    | extend UserPrincipalName = tolower(UserPrincipalName)\n    | extend timestamp = TimeGenerated, AccountCustomEntity\
  \ = UserPrincipalName\n  };\n  let aadSignin = aadFunc(\"SigninLogs\");\n  let aadNonInt = aadFunc(\"AADNonInteractiveUserSignInLogs\"\
  );\n  let allSignins = union isfuzzy=true aadSignin, aadNonInt;\n  let TimeSeriesAlerts = \n  allSignins\n  | make-series\
  \ DailyCount=count() on TimeGenerated from startofday(ago(starttime)) to startofday(now()) step 1d by UserPrincipalName\n\
  \  | extend (anomalies, score, baseline) = series_decompose_anomalies(DailyCount, scorethreshold, -1, 'linefit')\n  | mv-expand\
  \ DailyCount to typeof(double), TimeGenerated to typeof(datetime), anomalies to typeof(double), score to typeof(double),\
  \ baseline to typeof(long)\n  // Filtering low count events per baselinethreshold\n  | where anomalies > 0 and baseline\
  \ > baselinethreshold\n  | extend AnomalyHour = TimeGenerated\n  | project UserPrincipalName, AnomalyHour, TimeGenerated,\
  \ DailyCount, baseline, anomalies, score;\n  // Filter the alerts for specified timeframe\n  TimeSeriesAlerts\n  | where\
  \ TimeGenerated > startofday(ago(timeframe))\n  | join kind=inner ( \n    allSignins\n    | where TimeGenerated > startofday(ago(timeframe))\n\
  \    // create a new column and round to hour\n    | extend DateHour = bin(TimeGenerated, 1h)\n    | summarize PartialFailedSignins\
  \ = count(), LatestAnomalyTime = arg_max(TimeGenerated, *) by bin(TimeGenerated, 1h), OperationName, Category, ResultType,\
  \ ResultDescription, UserPrincipalName, UserDisplayName, AppDisplayName, ClientAppUsed, IPAddress, ResourceDisplayName\n\
  \  ) on UserPrincipalName, $left.AnomalyHour == $right.DateHour\n  | project LatestAnomalyTime, OperationName, Category,\
  \ UserPrincipalName, UserDisplayName, ResultType, ResultDescription, AppDisplayName, ClientAppUsed, UserAgent, IPAddress,\
  \ Location, AuthenticationRequirement, ConditionalAccessStatus, ResourceDisplayName, PartialFailedSignins, TotalFailedSignins\
  \ = DailyCount, baseline, anomalies, score\n  | extend timestamp = LatestAnomalyTime, Name = tostring(split(UserPrincipalName,'@',0)[0]),\
  \ UPNSuffix = tostring(split(UserPrincipalName,'@',1)[0])\n  | extend UserPrincipalName = tolower(UserPrincipalName)\n \
  \ | join kind=leftouter (\n      IdentityInfo\n      | summarize LatestReportTime = arg_max(TimeGenerated, *) by AccountUPN\n\
  \      | project AccountUPN, Tags, JobTitle, GroupMembership, AssignedRoles, UserType, IsAccountEnabled\n      | summarize\n\
  \          Tags = make_set(Tags, 1000),\n          GroupMembership = make_set(GroupMembership, 1000),\n          AssignedRoles\
  \ = make_set(AssignedRoles, 1000),\n          UserType = make_set(UserType, 1000),\n          UserAccountControl = make_set(UserType,\
  \ 1000)\n      by AccountUPN\n      | extend UserPrincipalName=tolower(AccountUPN)\n  ) on UserPrincipalName\n  | join kind=leftouter\
  \ (\n      BehaviorAnalytics\n      | where ActivityType in (\"FailedLogOn\", \"LogOn\")\n      | where isnotempty(SourceIPAddress)\n\
  \      | project UsersInsights, DevicesInsights, ActivityInsights, InvestigationPriority, SourceIPAddress\n      | project-rename\
  \ IPAddress = SourceIPAddress\n      | summarize\n          UsersInsights = make_set(UsersInsights, 1000),\n          DevicesInsights\
  \ = make_set(DevicesInsights, 1000),\n          IPInvestigationPriority = sum(InvestigationPriority)\n      by IPAddress)\n\
  \  on IPAddress\n  | extend UEBARiskScore = IPInvestigationPriority\n  | where UEBARiskScore > riskScoreCutoff\n  | sort\
  \ by UEBARiskScore desc"
queryFrequency: PT1H
queryPeriod: P14D
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT5H
suppressionEnabled: false
tactics:
- InitialAccess
techniques: []
subTechniques: []
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
