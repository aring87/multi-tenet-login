permissions:
  contents: read
jobs:
  select:
    name: Validate requested clients and rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Resolve selected clients
        id: matrix
        env:
          TARGET_CHOICES_JSON: ${{ toJSON(inputs) }}
          REQUESTED_RULE_PATH: ${{ inputs.rule_path }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: python scripts/target_matrix.py
  run:
    name: Run ${{ matrix.target }}
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/sentinel-workspace.yml
    with:
      target: ${{ matrix.target }}
      rule_path: ${{ inputs.rule_path }}
      mode: ${{ inputs.mode }}
    permissions:
      contents: read
      id-token: write
