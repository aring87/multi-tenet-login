id: e34f4811-2282-45e7-94c6-8215737d1c36
name: TI map IP entity to LastPass data
description: Identifies a match in LastPass table from any IP IOC from TI
owner: security-engineering
status: baseline
kind: Scheduled
severity: Medium
enabled: true
query: "let dt_lookBack = 1h;\nlet ioc_lookBack = 14d;\nThreatIntelligenceIndicator\n| where TimeGenerated >= ago(ioc_lookBack)\
  \ and ExpirationDateTime > now()\n| where Active == true\n// Picking up only IOC's that contain the entities we want\n|\
  \ where isnotempty(NetworkIP) or isnotempty(EmailSourceIpAddress) or isnotempty(NetworkDestinationIP) or isnotempty(NetworkSourceIP)\n\
  // As there is potentially more than 1 indicator type for matching IP, taking Network IP first, then others if that is empty.\n\
  // Taking the first non-empty value based on potential IOC match availability\n| extend TI_ipEntity = iff(isnotempty(NetworkIP),\
  \ NetworkIP, NetworkDestinationIP)\n| extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(NetworkSourceIP), NetworkSourceIP,\
  \ TI_ipEntity)\n| extend TI_ipEntity = iff(isempty(TI_ipEntity) and isnotempty(EmailSourceIpAddress), EmailSourceIpAddress,\
  \ TI_ipEntity)\n| join (\n    prod_LastPass_AuditLogs_CL \n    | where todatetime(LogTime_t) >= ago(dt_lookBack)\n    |\
  \ where Action_s != \"Reporting\"\n    // renaming time column so it is clear the log this came from\n    | extend LastPass_TimeGenerated\
  \ = todatetime(LogTime_t)\n)\non $left.TI_ipEntity == $right.Ip_s\n| summarize LatestIndicatorTime = arg_max(TimeGenerated,\
  \ *) by IndicatorId\n| project LatestIndicatorTime, Description, ActivityGroupNames, IndicatorId, ThreatType, Url, ExpirationDateTime,\
  \ ConfidenceScore, LastPass_TimeGenerated, \nTI_ipEntity, Ip_s, Username_s, Action_s, Data_s, NetworkIP, NetworkDestinationIP,\
  \ NetworkSourceIP, EmailSourceIpAddress\n| extend timestamp = LastPass_TimeGenerated, AccountCustomEntity = Username_s,\
  \ IPCustomEntity = Ip_s, URLCustomEntity = Url"
queryFrequency: PT1H
queryPeriod: P14D
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: PT1H
suppressionEnabled: false
tactics:
- Impact
techniques: []
subTechniques: []
alertRuleTemplateName: 2a723664-22c2-4d3e-bbec-5843b90166f3
eventGroupingSettings:
  aggregationKind: SingleAlert
createIncident: false
groupingConfiguration:
  enabled: false
  reopenClosedIncident: false
  lookbackDuration: PT5M
  matchingMethod: AllEntities
  groupByEntities: []
  groupByAlertDetails: []
  groupByCustomDetails: []
